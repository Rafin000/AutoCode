name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── CLI build + lint ──────────────────────────────────────────
  cli:
    name: CLI — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify CLI runs
        run: ./bin/auto-coder --help

  # ─── API (Cloudflare Worker) build ─────────────────────────────
  api:
    name: API — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Dry-run deploy (verify Worker compiles)
        working-directory: api
        run: npx wrangler deploy --dry-run --outdir=dist

  # ─── Deploy API to Cloudflare (only on push to main) ──────────
  deploy:
    name: Deploy API to Cloudflare
    runs-on: ubuntu-latest
    needs: [cli, api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: api
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
